[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pea-day-trading-lab"
version = "0.1.0"
description = "Laboratoire personnel de paper trading PEA, sans ordres réels"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.65,<2", "exchange-calendars>=4.5,<5"]

[project.scripts]
pea-lab = "pea_day_trading_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
